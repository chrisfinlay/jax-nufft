name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python version matrix via pixi envs: test-py311=3.11, test=3.12,
        # test-py313=3.13, test-py314=3.14. conda-forge has no jax-finufft
        # build for 3.10, so 3.10 is unsupported (see pixi.toml / pyproject).
        environment: [test-py311, test, test-py313, test-py314]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          # Resolve the CPU test env from conda-forge (jax-finufft cpu
          # build); the lockfile pins exact versions for reproducibility.
          environments: ${{ matrix.environment }}
          locked: true

      - name: Run pytest (fast)
        run: pixi run -e ${{ matrix.environment }} test -ra

      - name: Run pytest (slow ducc parity)
        run: pixi run -e ${{ matrix.environment }} test -ra --runslow

  test-float32:
    # Separate job rather than another matrix dimension: a single-precision
    # failure then shows up as its own line in the checks list instead of
    # hiding inside a Python-version cell. Scope is deliberately narrow --
    # `collect_ignore` in tests/conftest.py skips the modules that are not
    # precision-aware yet, and later issues shrink that list.
    name: pytest (float32)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: test
          locked: true

      - name: Run pytest with jax_enable_x64 off
        env:
          JAX_ENABLE_X64: "0"
        run: pixi run -e test test -ra

  jax-floor:
    # Issue #53. Every other job here runs the single jax the pixi lockfile
    # resolves, so the `jax>=` bound in pyproject.toml was exercised by nothing
    # and was free to drift from the code -- it said 0.5.0 while wgridder.py
    # called `jax.typeof`, added in 0.6.0 (found and fixed on #21). This job is
    # the only thing that runs the declared minimum.
    #
    # jax ALONE, no matrix, so the job is one pip install and a few seconds.
    # Running the whole suite at the floor would need a conda-forge
    # jax-finufft that solves against a jax that old on all three platforms;
    # #53 puts that out of scope and it has not been attempted. The probe
    # reads the floor out of pyproject.toml rather than repeating it here, so
    # this job follows the declaration and cannot itself go stale.
    name: jax floor probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The oldest interpreter the project supports (`requires-python`),
          # paired with the oldest jax it supports: the combination most
          # likely to be missing something.
          python-version: "3.11"

      - name: Read the declared jax floor
        id: floor
        # stdlib only -- the probe deliberately imports no jax for this, so it
        # runs before anything is installed. Assigned to a variable under
        # `set -e` rather than substituted straight into `echo`, so a probe
        # that cannot read pyproject.toml fails here instead of silently
        # writing an empty pin.
        run: |
          set -euo pipefail
          version="$(python tests/jax_floor_probe.py --print-floor)"
          echo "pyproject.toml declares jax>=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install jax at the declared floor
        run: python -m pip install "jax==${{ steps.floor.outputs.version }}"

      - name: Probe the floor
        run: python tests/jax_floor_probe.py

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: dev
          locked: true

      - name: ruff check
        run: pixi run -e dev lint

      - name: ruff format --check
        run: pixi run -e dev ruff format --check src tests

      - name: mypy
        run: pixi run -e dev typecheck
